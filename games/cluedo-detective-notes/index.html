<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2433">
<title>Detective Notes</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1d2433;
    --muted: #6b7280;
    --line: #d9dce3;
    --line-strong: #b9bec9;
    --accent: #3b5bdb;
    --me: #eef2ff;
    --me-line: #c7d2fe;
    --yes: #2f9e44;
    --yes-bg: #e6f5ea;
    --no: #c92a2a;
    --no-bg: #fbeaea;
    --maybe: #e8900c;
    --maybe-bg: #fdf3e2;
    --solved-bg: #fff8d6;
    --solved-line: #f1d472;
    --cat-suspects: #4c6ef5;
    --cat-weapons: #e8590c;
    --cat-rooms: #0ca678;
    --radius: 10px;
    --tap: 44px;
    --header-h: 52px;         /* app header height, kept in sync by JS */
    /* Grid sizing scales with --ui-scale so the whole table can be shrunk
       to fit the screen width (set from Settings / the Fit button). */
    --ui-scale: 1;
    --cell: calc(42px * var(--ui-scale));
    --card-col: calc(124px * var(--ui-scale));
    --cell-font: calc(19px * var(--ui-scale));
    --card-font: calc(14px * var(--ui-scale));
    --head-font: calc(13px * var(--ui-scale));
  }
  /* Dark palette: applied by the system in auto mode (unless forced light),
     or explicitly when data-theme="dark". Kept as two copies on purpose so a
     manual choice always wins over the OS setting. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141b;
      --panel: #1a1f29;
      --ink: #e6e8ee;
      --muted: #99a1b3;
      --line: #2b3240;
      --line-strong: #3a4354;
      --accent: #6b8afd;
      --me: #1b2440;
      --me-line: #35406a;
      --yes: #51cf66;
      --yes-bg: #16321f;
      --no: #ff6b6b;
      --no-bg: #371a1a;
      --maybe: #ffc078;
      --maybe-bg: #3a2c12;
      --solved-bg: #3a330f;
      --solved-line: #6d5e1b;
      --cat-suspects: #748ffc;
      --cat-weapons: #ff922b;
      --cat-rooms: #38d9a9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141b;
    --panel: #1a1f29;
    --ink: #e6e8ee;
    --muted: #99a1b3;
    --line: #2b3240;
    --line-strong: #3a4354;
    --accent: #6b8afd;
    --me: #1b2440;
    --me-line: #35406a;
    --yes: #51cf66;
    --yes-bg: #16321f;
    --no: #ff6b6b;
    --no-bg: #371a1a;
    --maybe: #ffc078;
    --maybe-bg: #3a2c12;
    --solved-bg: #3a330f;
    --solved-line: #6d5e1b;
    --cat-suspects: #748ffc;
    --cat-weapons: #ff922b;
    --cat-rooms: #38d9a9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 40;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .brand .logo {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #5c7cfa); color: #fff;
    border-radius: 9px; font-size: 17px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; min-height: var(--tap);
  }
  button.icon { min-width: 42px; min-height: 42px; padding: 8px; font-size: 17px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; min-height: 40px;
    border: 1px solid var(--line-strong); background: var(--panel); font-size: 14px;
  }
  .chip b { font-weight: 650; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ghost { background: transparent; border-color: var(--line); }
  .lang-toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .lang-toggle button { border: 0; border-radius: 0; padding: 8px 10px; min-height: 40px; background: transparent; color: var(--muted); }
  .lang-toggle button.on { background: var(--accent); color: #fff; }

  main { padding: 12px; max-width: 760px; margin: 0 auto; }

  /* Grid */
  /* Single page scroll. The frame hugs the table; the table fits the screen
     width via --ui-scale (Settings / Fit), so no side-scrolling is needed.
     The header row stays pinned just below the sticky app header. */
  .grid-wrap { width: fit-content; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); text-align: center; }
  thead th {
    position: sticky; top: var(--header-h); background: var(--panel); z-index: 10;
    font-weight: 600; font-size: var(--head-font); padding: 8px 4px; vertical-align: bottom;
  }
  th.card-head {
    position: sticky; left: 0; z-index: 20; background: var(--panel);
    text-align: left; min-width: var(--card-col); max-width: calc(var(--card-col) * 1.3);
  }
  td.card-cell {
    position: sticky; left: 0; z-index: 5; background: var(--panel);
    text-align: left; padding: 8px 8px; font-size: var(--card-font);
    min-width: var(--card-col); max-width: calc(var(--card-col) * 1.3);
    line-height: 1.25; border-left: 4px solid var(--cat, var(--line));
  }
  tr.section-row th {
    position: sticky; left: 0; z-index: 6;
    background: var(--bg); color: var(--cat, var(--muted));
    text-transform: uppercase; letter-spacing: .6px; font-size: 11px;
    text-align: left; padding: 7px 8px 7px 10px; font-weight: 800;
    border-left: 4px solid var(--cat, var(--line));
  }
  tr.cat-suspects { --cat: var(--cat-suspects); }
  tr.cat-weapons { --cat: var(--cat-weapons); }
  tr.cat-rooms { --cat: var(--cat-rooms); }
  th.player-head .pname { display: block; max-width: calc(var(--cell) + 14px); margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th.player-head.me { background: var(--me); }
  td.mark { min-width: var(--cell); height: var(--cell); padding: 0; cursor: pointer; font-size: var(--cell-font); font-weight: 700; user-select: none; }
  td.col-me { background: var(--me); }
  td.mark.yes { color: var(--yes); background: var(--yes-bg); }
  td.mark.no { color: var(--no); background: var(--no-bg); }
  td.mark.maybe { color: var(--maybe); background: var(--maybe-bg); }
  tr.solved td.card-cell, tr.solved th.card-head { background: var(--solved-bg); font-weight: 700; }
  tr.solved { outline: 2px solid var(--solved-line); outline-offset: -2px; }
  .solvetag { display: inline-block; font-size: 10px; font-weight: 800; color: #8a6d00; margin-left: 4px; vertical-align: middle; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .solvetag { color: var(--maybe); } }
  :root[data-theme="dark"] .solvetag { color: var(--maybe); }

  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 10px 2px 2px; color: var(--muted); font-size: 13px; }
  .legend b { font-size: 15px; }
  .legend .l-yes { color: var(--yes); } .legend .l-no { color: var(--no); } .legend .l-maybe { color: var(--maybe); }

  /* Notepad */
  section.block { margin-top: 18px; }
  section.block > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 2px 8px; }
  textarea#notes {
    width: 100%; min-height: 160px; resize: vertical;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); padding: 12px; font: inherit;
  }

  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  /* Menu sheet */
  .menu-lang { display: flex; align-items: center; gap: 10px; padding: 10px 2px 4px; }
  .menu-lang .lang-toggle { margin-left: auto; }
  .menu-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; width: 100%; justify-content: flex-start;
    padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); font-size: 15px; text-align: left;
  }
  .menu-item .mi-ico { font-size: 18px; width: 22px; text-align: center; flex: none; }

  /* Privacy cover — hides the whole sheet and notes from onlookers */
  .privacy-screen {
    position: fixed; inset: 0; z-index: 200; background: var(--bg);
    display: grid; place-items: center; text-align: center; padding: 24px;
  }
  .privacy-screen[hidden] { display: none; }
  .ps-card { max-width: 320px; }
  .ps-lock {
    width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #5c7cfa); color: #fff;
    border-radius: 22px; font-size: 36px;
  }
  .ps-title { font-size: 21px; font-weight: 700; }
  .ps-sub { color: var(--muted); margin: 8px 0 22px; }
  .ps-reveal { min-width: 190px; font-size: 16px; }

  /* Modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 560px) { .modal-back { align-items: center; } }
  .modal {
    background: var(--panel); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width: 560px) { .modal { border-radius: 16px; } }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .modal input[type=text], .modal select {
    width: 100%; padding: 10px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .player-edit { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .player-edit input[type=text] { flex: 1; }
  .player-edit .me-pick { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .player-edit button.del { color: var(--no); border-color: var(--line); }
  .cards-group { margin: 14px 0; }
  .cards-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 6px; }
  .card-edit { display: flex; gap: 8px; margin: 5px 0; }
  .card-edit input { flex: 1; }
  .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .check-list label { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); font-size: 14px; padding: 6px 2px; }
  .check-list input { width: 20px; height: 20px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .toggle-line { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .toggle-line input { width: 22px; height: 22px; }
  .danger { color: var(--no); border-color: var(--no); background: transparent; }
  .mini { font-size: 12px; color: var(--muted); }

  /* Editions list */
  .preset-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .preset-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); cursor: pointer;
  }
  .preset-item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .preset-item .pi-main { flex: 1; min-width: 0; }
  .preset-item .pi-name { font-weight: 600; }
  .preset-item .pi-sub { font-size: 12px; color: var(--muted); }
  .preset-item .pi-badge { font-size: 11px; color: var(--accent); font-weight: 700; }
  .preset-item .pi-btn { padding: 6px 8px; min-height: 36px; font-size: 13px; border-color: var(--line); background: transparent; }
  .preset-item .pi-btn.del { color: var(--no); }

  /* Help / instructions */
  .help-body h3 { font-size: 14px; margin: 16px 0 6px; }
  .help-body p { margin: 6px 0; color: var(--ink); font-size: 14px; }
  .help-body ul { margin: 6px 0; padding-left: 20px; }
  .help-body li { margin: 4px 0; font-size: 14px; }
  .help-body .key {
    display: inline-block; min-width: 20px; text-align: center; font-weight: 700;
    border-radius: 5px; padding: 0 5px;
  }
  .help-body .key.yes { color: var(--yes); background: var(--yes-bg); }
  .help-body .key.no { color: var(--no); background: var(--no-bg); }
  .help-body .key.maybe { color: var(--maybe); background: var(--maybe-bg); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">🔍</span>
    <h1 id="app-title">Detective Notes</h1>
  </div>
  <button id="btn-edition-chip" class="chip" title="Editions" data-i18n-title="editionsTitle">🃏 <b id="edition-name">Classic</b></button>
  <button class="icon" id="btn-privacy" title="Privacy" aria-label="Privacy" data-i18n-title="privacy">🙈</button>
  <button class="icon" id="btn-menu" title="Menu" aria-label="Menu" data-i18n-title="menuTitle">☰</button>
</header>

<main>
  <div class="grid-wrap">
    <table id="grid"></table>
  </div>

  <div class="legend">
    <span><b class="l-yes">✓</b> <span data-i18n="legYes">has the card</span></span>
    <span><b class="l-no">✗</b> <span data-i18n="legNo">doesn't have it</span></span>
    <span><b class="l-maybe">?</b> <span data-i18n="legMaybe">maybe</span></span>
    <span data-i18n="legTap">Tap a cell to cycle</span>
  </div>

  <section class="block">
    <h2 data-i18n="notesTitle">Notepad</h2>
    <textarea id="notes" data-i18n-ph="notesPh" placeholder="Who asked what, who showed a card, hunches…"></textarea>
  </section>

  <p class="mini" style="margin-top:22px;text-align:center" data-i18n="footer">
    Offline — everything is saved on this device only. Open-source Cluedo detective notes.
  </p>
  <p class="mini" style="margin-top:6px;text-align:center;opacity:.6" id="app-version"></p>
</main>

<div id="privacy-screen" class="privacy-screen" hidden>
  <div class="ps-card">
    <div class="ps-lock">🔒</div>
    <div class="ps-title" id="ps-title" data-i18n="privacyTitle">Content hidden</div>
    <div class="ps-sub" id="ps-sub" data-i18n="privacySub">So nobody can read your sheet or notes.</div>
    <button id="ps-reveal" class="primary ps-reveal" data-i18n="reveal">Reveal</button>
  </div>
</div>

<div id="modal-root"></div>

var DEFAULT_CARDS = {
  en: {
    suspects: ["Miss Scarlett", "Colonel Mustard", "Mrs White", "Reverend Green", "Mrs Peacock", "Professor Plum"],
    weapons: ["Candlestick", "Dagger", "Lead pipe", "Revolver", "Rope", "Wrench"],
    rooms: ["Kitchen", "Ballroom", "Conservatory", "Dining room", "Billiard room", "Library", "Lounge", "Hall", "Study"]
  },
  it: {
    suspects: ["Miss Scarlett", "Colonnello Mustard", "Signora White", "Reverendo Green", "Signora Peacock", "Professor Plum"],
    weapons: ["Candeliere", "Pugnale", "Tubo di piombo", "Rivoltella", "Corda", "Chiave inglese"],
    rooms: ["Cucina", "Sala da ballo", "Serra", "Sala da pranzo", "Sala del biliardo", "Biblioteca", "Salotto", "Ingresso", "Studio"]
  }
};

var CATS = ["suspects", "weapons", "rooms"];

/* Built-in editions. "cards" is per-language; user editions store a flat card set. */
var BUILTIN_PRESETS = [
  { id: "classic", builtin: true, name: { en: "Classic", it: "Classico" }, cards: DEFAULT_CARDS }
];

/* ---------- state ---------- */
var state = null;
var lang = lsGet(LANG_KEY) || (navigator.language && navigator.language.indexOf("it") === 0 ? "it" : "en");
if (lang !== "en" && lang !== "it") lang = "en";

function uid(p) { return p + Math.random().toString(36).slice(2, 9); }
function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function fmt(s, o) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return o[k] != null ? o[k] : ""; }); }

/* ---------- small DOM helpers (every dynamic piece of UI goes through these) ---------- */
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(label, cls, onClick) {
  var b = el("button", cls, label);
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
function byId(id) { return document.getElementById(id); }
function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
// Segmented control shared by the language and theme pickers.
function segmented(opts, current, onPick) {
  var seg = el("div", "lang-toggle");
  opts.forEach(function (o) {
    var b = btn(o.label, o.v === current ? "on" : "", function () {
      Array.prototype.forEach.call(seg.children, function (x) { x.classList.toggle("on", x === b); });
      onPick(o.v);
    });
    seg.appendChild(b);
  });
  return seg;
}
// "Label ........ [control]" row used in the menu (language) and settings (theme).
function labelRow(label, control) {
  var row = el("div", "menu-lang");
  row.appendChild(el("span", null, label));
  row.appendChild(control);
  return row;
}

/* ---------- editions (presets) ---------- */
function presetName(p) { return typeof p.name === "string" ? p.name : (p.name[lang] || p.name.en); }
function presetFlatCards(p) {
  var c = p.cards;
  if (c && c[lang] && c[lang].suspects) return c[lang];   // per-language built-in, current lang
  if (c && c.en && c.en.suspects) return c.en;            // built-in fallback
  return c;                                               // flat user edition
}
function allPresets() { return BUILTIN_PRESETS.concat(state.presets || []); }
function activePreset() {
  return allPresets().filter(function (p) { return p.id === state.activePresetId; })[0] || null;
}
// {suspects: [names]} -> {suspects: [{id, name}]} (fresh ids)
function cardsFromNames(flat) {
  var cats = {};
  CATS.forEach(function (c) {
    cats[c] = (flat[c] || []).map(function (name) { return { id: uid("c"), name: name }; });
  });
  return cats;
}
// Replace the whole card set (new edition / reset): marks can't survive that.
function replaceCards(flat, presetId) {
  state.cards = cardsFromNames(flat);
  state.marks = {};
  state.auto = {};
  state.activePresetId = presetId;
  save();
}
function loadPresetCards(p) { replaceCards(presetFlatCards(p), p.id); }

/* Switch UI language. The built-in edition ships its cards in both languages,
   so cards that still carry the old language's default name follow along
   (same ids: marks are untouched). Renamed cards and custom editions are
   left as the user wrote them. */
function setLang(l) {
  if (l === lang || !I18N[l]) return;
  var ap = activePreset();
  if (ap && ap.builtin && ap.cards[lang] && ap.cards[l]) {
    CATS.forEach(function (c) {
      var from = ap.cards[lang][c] || [], to = ap.cards[l][c] || [];
      (state.cards[c] || []).forEach(function (card) {
        var i = from.indexOf(card.name);
        if (i >= 0 && to[i]) card.name = to[i];
      });
    });
    save();
  }
  lang = l;
  lsSet(LANG_KEY, l);
}

function defaultState() {
  return {
    version: 2,
    autoDeduce: true,
    theme: "auto",   // "auto" | "light" | "dark"
    uiScale: 1,      // grid zoom factor (0.5–1.3)
    activePresetId: "classic",
    presets: [],
    players: (function () {
      var arr = [{ id: uid("p"), name: t("me") === "io" ? "Io" : "Me", isMe: true }];
      var short = lang === "it" ? "G" : "P";   // short labels keep columns narrow & distinct
      for (var i = 2; i <= 6; i++) arr.push({ id: uid("p"), name: short + i, isMe: false });
      return arr;  // Cluedo seats up to 6; removing is quicker than adding
    })(),
    cards: cardsFromNames(DEFAULT_CARDS[lang]),
    marks: {},       // marks[cardId][playerId] = 'yes'|'no'|'maybe'
    auto: {},        // auto[cardId][playerId] = true  -> this 'no' was auto-derived from a 'yes'
    notes: ""
  };
}

function load() {
  var raw = lsGet(STORE_KEY);
  if (raw) {
    try {
      var s = JSON.parse(raw);
      if (s && s.players && s.cards) {
        if (!Array.isArray(s.presets)) s.presets = [];
        if (!s.activePresetId) s.activePresetId = "classic";
        if (!s.auto) s.auto = {};
        if (!s.theme) s.theme = "auto";
        if (typeof s.uiScale !== "number") s.uiScale = 1;
        state = s; return;
      }
    } catch (e) { /* corrupt — start fresh */ }
  }
  state = defaultState();
  save();
}
function save() {
  lsSet(STORE_KEY, JSON.stringify(state));
}

/* theme: "auto" follows the OS; "light"/"dark" force it via data-theme */
function applyTheme() {
  var th = (state && state.theme) || "auto";
  if (th === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", th);
}

/* privacy cover (in-memory; a reload clears it) */
function setPrivacy(on) {
  var el = byId("privacy-screen");
  if (!el) return;
  if (on) el.removeAttribute("hidden"); else el.setAttribute("hidden", "");
}

/* grid zoom: scale the whole table so it fits the screen width */
function applyScale() {
  document.documentElement.style.setProperty("--ui-scale", (state && state.uiScale) || 1);
}
function setScale(s) {
  s = Math.max(0.5, Math.min(1.3, s));
  state.uiScale = Math.round(s * 100) / 100;
  applyScale(); save();
}
function availWidth() {
  var main = document.querySelector("main");
  return (main ? main.clientWidth : document.documentElement.clientWidth) - 26;  // main padding + frame border
}
function naturalGridWidth() {
  var tbl = byId("grid");
  if (!tbl) return 0;
  var w = tbl.getBoundingClientRect().width, sc = state.uiScale || 1;
  return w > 0 ? w / sc : 0;  // width it would have at scale 1
}
function fitGrid() {            // fit exactly to the width (never past 100%)
  var nat = naturalGridWidth(); if (!nat) return;
  setScale(Math.min(1, availWidth() / nat));
}
function fitIfOverflow() {      // shrink only, so the page never needs side-scroll on load
  var nat = naturalGridWidth(); if (!nat) return;
  if (nat * (state.uiScale || 1) > availWidth() + 1) {
    var s = availWidth() / nat;
    if (s < (state.uiScale || 1)) setScale(s);
  }
}

/* ---------- mark helpers ---------- */
function getMark(cardId, playerId) {
  return (state.marks[cardId] && state.marks[cardId][playerId]) || null;
}
function setMark(cardId, playerId, val) {
  if (!state.marks[cardId]) state.marks[cardId] = {};
  if (val === null) delete state.marks[cardId][playerId];
  else state.marks[cardId][playerId] = val;
}
var CYCLE = { "null": "no", "no": "yes", "yes": "maybe", "maybe": null };
var SYMBOL = { yes: "✓", no: "✗", maybe: "?" };

/* auto-derived 'no' tracking (so leaving a ✓ removes the ✗ it placed) */
function isAuto(cardId, playerId) { return !!(state.auto[cardId] && state.auto[cardId][playerId]); }
function setAuto(cardId, playerId, v) {
  if (v) { if (!state.auto[cardId]) state.auto[cardId] = {}; state.auto[cardId][playerId] = true; }
  else if (state.auto[cardId]) { delete state.auto[cardId][playerId]; }
}

// Re-derive the automatic ✗ of one card from its current ✓ owner(s):
// drop every ✗ this app placed, then fill the blanks of the non-owners
// again. Manual marks are never touched. Recomputing (instead of
// cascading/uncascading around the tapped cell) keeps the row right when
// a card has two ✓, when one of them is removed, or when a ✓ owner leaves
// the table. No-op while auto-deduction is off.
function reconcileAuto(cardId) {
  if (!state.autoDeduce) return;
  var hasOwner = false;
  state.players.forEach(function (p) {
    if (isAuto(cardId, p.id)) {
      if (getMark(cardId, p.id) === "no") setMark(cardId, p.id, null);
      setAuto(cardId, p.id, false);
    }
    if (getMark(cardId, p.id) === "yes") hasOwner = true;
  });
  if (!hasOwner) return;
  state.players.forEach(function (p) {
    if (getMark(cardId, p.id) === null) {
      setMark(cardId, p.id, "no");
      setAuto(cardId, p.id, true);
    }
  });
}

// A manual decision on one cell (tap in the grid or tick in "My cards").
function setCell(cardId, playerId, val) {
  setAuto(cardId, playerId, false);
  setMark(cardId, playerId, val);
  reconcileAuto(cardId);
  save();
}
function cycleCell(cardId, playerId) {
  var cur = getMark(cardId, playerId);
  setCell(cardId, playerId, CYCLE[cur === null ? "null" : cur]);
  if (!grid.rows[cardId]) render();            // row not on screen (shouldn't happen): full refresh
  else if (paintCard(cardId)) fitIfOverflow();  // only this row changed; the SOLUTION flag can widen it
}

// a card is "solved" (in the envelope) if ruled out (no) for every player
function isSolved(cardId) {
  if (state.players.length === 0) return false;
  return state.players.every(function (p) { return getMark(cardId, p.id) === "no"; });
}

/* ---------- grid ----------
   The table is (re)built only when its shape changes: players, cards or
   language. Marks are painted into the existing cells, so a tap touches
   one row instead of rebuilding 126 cells. One click listener on the
   table (event delegation) replaces one per cell. */
var grid = { key: null, cells: {}, rows: {} };   // cells[cardId][playerId] = td ; rows[cardId] = {tr, cc, tag}

function gridKey() {
  return lang + "|" +
    state.players.map(function (p) { return p.id + ":" + p.name + ":" + (p.isMe ? 1 : 0); }).join(",") + "|" +
    CATS.map(function (c) { return (state.cards[c] || []).map(function (x) { return x.id + ":" + x.name; }).join(","); }).join(";");
}

function buildGrid() {
  var tbl = byId("grid");
  tbl.textContent = "";
  grid.cells = {}; grid.rows = {};

  var thead = el("thead"), hr = el("tr");
  hr.appendChild(el("th", "card-head"));
  state.players.forEach(function (p) {
    var th = el("th", "player-head" + (p.isMe ? " me" : ""));
    th.appendChild(el("span", "pname", p.name + (p.isMe ? " ★" : "")));
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);

  var tbody = el("tbody");
  CATS.forEach(function (cat) {
    var sr = el("tr", "section-row cat-" + cat);
    var sth = el("th", null, t(cat));
    sth.colSpan = state.players.length + 1;
    sr.appendChild(sth);
    tbody.appendChild(sr);

    (state.cards[cat] || []).forEach(function (card) {
      var tr = el("tr", "cat-" + cat);
      var cc = el("td", "card-cell", card.name);
      tr.appendChild(cc);
      var cells = grid.cells[card.id] = {};
      state.players.forEach(function (p) {
        var td = el("td", "mark" + (p.isMe ? " col-me" : ""));
        td.setAttribute("data-c", card.id);
        td.setAttribute("data-p", p.id);
        cells[p.id] = td;
        tr.appendChild(td);
      });
      grid.rows[card.id] = { tr: tr, cc: cc, tag: null, solved: false };
      tbody.appendChild(tr);
      paintCard(card.id);
    });
  });
  tbl.appendChild(tbody);
}

// Paint one card's row from state: cell marks + the SOLUTION flag.
// Returns true when the solved flag flipped (the row's width may change).
function paintCard(cardId) {
  var r = grid.rows[cardId];
  if (!r) return false;
  state.players.forEach(function (p) {
    var td = grid.cells[cardId][p.id];
    if (!td) return;
    var mk = getMark(cardId, p.id);
    var cls = "mark" + (mk ? " " + mk : "") + (p.isMe ? " col-me" : "");
    var sym = SYMBOL[mk] || "";
    if (td.className !== cls) td.className = cls;
    if (td.textContent !== sym) td.textContent = sym;
  });
  var solved = isSolved(cardId);
  if (solved === r.solved) return false;
  r.solved = solved;
  r.tr.classList.toggle("solved", solved);
  if (solved) {
    r.tag = el("span", "solvetag", " ◆ " + t("solution"));
    r.cc.appendChild(r.tag);
  } else if (r.tag) {
    r.cc.removeChild(r.tag);
    r.tag = null;
  }
  return true;
}

function applyI18n() {
  document.documentElement.lang = lang;
  byId("app-title").textContent = t("title");
  each("[data-i18n]", function (e) { e.textContent = t(e.getAttribute("data-i18n")); });
  each("[data-i18n-ph]", function (e) { e.placeholder = t(e.getAttribute("data-i18n-ph")); });
  each("[data-i18n-title]", function (e) {
    var s = t(e.getAttribute("data-i18n-title"));
    e.title = s; e.setAttribute("aria-label", s);
  });
}

/* Full refresh of everything outside the modals. Cheap when the grid's
   shape is unchanged (marks are repainted in place). */
function render() {
  applyTheme();
  applyScale();
  applyI18n();
  byId("notes").value = state.notes || "";
  var ap = activePreset();
  byId("edition-name").textContent = ap ? presetName(ap) : t("custom");

  var key = gridKey();
  if (key !== grid.key) { buildGrid(); grid.key = key; }
  else CATS.forEach(function (c) { (state.cards[c] || []).forEach(function (card) { paintCard(card.id); }); });
  updateHeaderOffset();
  fitIfOverflow();
}

// keep the grid's available height in sync with the (wrapping) app header
function updateHeaderOffset() {
  var h = document.querySelector("header");
  if (h) document.documentElement.style.setProperty("--header-h", Math.round(h.getBoundingClientRect().height) + "px");
}

/* ---------- modal plumbing ---------- */
function openModal(buildBody) {
  var root = byId("modal-root");
  var back = el("div", "modal-back");
  var modal = el("div", "modal");
  back.appendChild(modal);
  back.addEventListener("click", function (e) { if (e.target === back) closeModal(); });
  root.appendChild(back);
  buildBody(modal);
}
function closeModal() {
  byId("modal-root").textContent = "";
  render();
}
function modalHead(m, title, hint) {
  m.appendChild(el("h2", null, title));
  if (hint) m.appendChild(el("p", "mini", hint));
}
// Bottom action bar; with no buttons given it is just the "Done" button.
function actionBar(m, buttons) {
  var a = el("div", "modal-actions");
  (buttons || [btn(t("done"), "primary", closeModal)]).forEach(function (b) { a.appendChild(b); });
  m.appendChild(a);
}
// Title + hint + Cancel/OK. Cancel closes (or runs onCancel); danger paints OK red.
function confirmModal(title, hint, okLabel, onOk, onCancel, danger) {
  openModal(function (m) {
    modalHead(m, title, hint);
    var ok = btn(okLabel, "primary" + (danger ? " danger" : ""), onOk);
    if (danger) { ok.style.color = "#fff"; ok.style.background = "var(--no)"; ok.style.borderColor = "var(--no)"; }
    actionBar(m, [btn(t("cancel"), "ghost", onCancel || closeModal), ok]);
  });
}

/* ---------- players modal ---------- */
function playersModal() {
  openModal(function (m) {
    modalHead(m, t("playersTitle"), t("playersHint"));
    var list = el("div");
    m.appendChild(list);

    function removePlayer(p, idx) {
      if (state.players.length <= 2) return;
      // clean marks for this player; the ✗ its ✓ had derived on others go too
      var owned = Object.keys(state.marks).filter(function (cid) { return state.marks[cid][p.id] === "yes"; });
      Object.keys(state.marks).forEach(function (cid) { delete state.marks[cid][p.id]; });
      Object.keys(state.auto).forEach(function (cid) { delete state.auto[cid][p.id]; });
      state.players.splice(idx, 1);
      owned.forEach(reconcileAuto);
      if (!state.players.some(function (q) { return q.isMe; })) state.players[0].isMe = true;
      save(); drawList();
    }

    function drawList() {
      list.textContent = "";
      state.players.forEach(function (p, idx) {
        var row = el("div", "player-edit");
        var inp = el("input");
        inp.type = "text"; inp.value = p.name;
        inp.addEventListener("input", function () { p.name = inp.value; save(); });
        var meLbl = el("label", "me-pick");
        var meRadio = el("input");
        meRadio.type = "radio"; meRadio.name = "me-pick"; meRadio.checked = !!p.isMe;
        meRadio.addEventListener("change", function () {
          state.players.forEach(function (q) { q.isMe = false; });
          p.isMe = true; save();
        });
        meLbl.appendChild(meRadio);
        meLbl.appendChild(document.createTextNode(t("me")));
        var del = btn("✕", "del", function () { removePlayer(p, idx); });
        del.title = t("remove");
        row.appendChild(inp); row.appendChild(meLbl); row.appendChild(del);
        list.appendChild(row);
      });
    }
    drawList();

    var add = btn("+ " + t("addPlayer"), "ghost", function () {
      state.players.push({ id: uid("p"), name: t("player") + " " + (state.players.length + 1), isMe: false });
      save(); drawList();
    });
    add.style.marginTop = "10px";
    m.appendChild(add);
    actionBar(m);
  });
}

/* ---------- settings modal (theme, zoom, auto-deduction, cards) ---------- */
function settingsModal() {
  openModal(function (m) {
    modalHead(m, t("settingsTitle"));

    // theme: auto / light / dark
    m.appendChild(labelRow(t("theme"), segmented(
      [{ v: "auto", label: t("themeAuto") }, { v: "light", label: t("themeLight") }, { v: "dark", label: t("themeDark") }],
      state.theme || "auto",
      function (v) { state.theme = v; save(); applyTheme(); }
    )));

    // grid size (zoom to fit the screen width)
    var szWrap = el("div"); szWrap.style.margin = "14px 0 2px";
    var szl = el("div", null, t("gridSize")); szl.style.marginBottom = "6px";
    var ctrl = el("div");
    ctrl.style.display = "flex"; ctrl.style.alignItems = "center"; ctrl.style.gap = "8px";
    var val = el("span");
    val.style.minWidth = "52px"; val.style.textAlign = "center"; val.style.fontVariantNumeric = "tabular-nums";
    function showVal() { val.textContent = Math.round((state.uiScale || 1) * 100) + "%"; }
    showVal();
    var fitBtn = btn(t("fit"), "ghost", function () { fitGrid(); showVal(); });
    fitBtn.style.marginLeft = "auto";
    ctrl.appendChild(btn("−", "icon", function () { setScale((state.uiScale || 1) - 0.1); showVal(); }));
    ctrl.appendChild(val);
    ctrl.appendChild(btn("+", "icon", function () { setScale((state.uiScale || 1) + 0.1); showVal(); }));
    ctrl.appendChild(fitBtn);
    szWrap.appendChild(szl); szWrap.appendChild(ctrl); m.appendChild(szWrap);

    // auto deduce toggle
    var tog = el("div", "toggle-line");
    var cb = el("input");
    cb.type = "checkbox"; cb.checked = !!state.autoDeduce; cb.id = "ad";
    cb.addEventListener("change", function () { state.autoDeduce = cb.checked; save(); });
    var lab = el("label", null, t("autoDeduce"));
    lab.setAttribute("for", "ad"); lab.style.margin = "0"; lab.style.color = "var(--ink)";
    tog.appendChild(cb); tog.appendChild(lab);
    m.appendChild(tog);
    m.appendChild(el("p", "mini", t("autoDeduceHint")));

    // cards editor
    var ct = el("h2", null, t("cardsTitle")); ct.style.fontSize = "16px"; ct.style.marginTop = "18px";
    m.appendChild(ct);
    m.appendChild(el("p", "mini", t("cardsHint")));

    CATS.forEach(function (cat) {
      var g = el("div", "cards-group");
      g.appendChild(el("h3", null, t(cat)));
      var wrap = el("div");
      function drawCards() {
        wrap.textContent = "";
        state.cards[cat].forEach(function (card, i) {
          var row = el("div", "card-edit");
          var inp = el("input"); inp.type = "text"; inp.value = card.name;
          inp.addEventListener("input", function () { card.name = inp.value; save(); });
          row.appendChild(inp);
          row.appendChild(btn("✕", "del danger", function () {
            delete state.marks[card.id]; delete state.auto[card.id];
            state.cards[cat].splice(i, 1); save(); drawCards();
          }));
          wrap.appendChild(row);
        });
      }
      drawCards();
      g.appendChild(wrap);
      g.appendChild(btn("+ " + t("addCard"), "ghost", function () {
        state.cards[cat].push({ id: uid("c"), name: "" }); save(); drawCards();
      }));
      m.appendChild(g);
    });

    var reset = btn(t("resetCards"), "ghost", function () {
      replaceCards(DEFAULT_CARDS[lang], "classic");   // the defaults ARE the built-in edition
      closeModal(); settingsModal();
    });
    reset.style.marginTop = "6px";
    m.appendChild(reset);
    actionBar(m);
  });
}

/* ---------- my hand modal ---------- */
function myHandModal() {
  var me = state.players.filter(function (p) { return p.isMe; })[0];
  openModal(function (m) {
    modalHead(m, t("myHandTitle"), me ? t("myHandHint") : null);
    if (!me) {
      m.appendChild(el("p", null, t("noMe")));
      actionBar(m);
      return;
    }
    CATS.forEach(function (cat) {
      var h = el("h3", null, t(cat));
      h.style.margin = "14px 0 6px"; h.style.fontSize = "13px";
      h.style.textTransform = "uppercase"; h.style.color = "var(--muted)";
      m.appendChild(h);
      var cl = el("div", "check-list");
      state.cards[cat].forEach(function (card) {
        var lab = el("label");
        var cb = el("input"); cb.type = "checkbox";
        cb.checked = getMark(card.id, me.id) === "yes";
        cb.addEventListener("change", function () { setCell(card.id, me.id, cb.checked ? "yes" : null); });
        lab.appendChild(cb); lab.appendChild(document.createTextNode(card.name));
        cl.appendChild(lab);
      });
      m.appendChild(cl);
    });
    actionBar(m);
  });
}

/* ---------- new game ---------- */
function newGameModal() {
  confirmModal(t("newGameTitle"), t("newGameHint"), t("clearMarks"), function () {
    state.marks = {}; state.auto = {}; state.notes = ""; save(); closeModal();
  }, null, true);
}

/* ---------- editions modal ---------- */
function editionsModal() {
  openModal(function (m) {
    modalHead(m, t("editionsTitle"), t("editionsHint"));
    var list = el("div", "preset-list");

    function confirmSwitch(p) {
      if (p.id === state.activePresetId) { closeModal(); return; }
      confirmModal(t("switchEditionTitle"), fmt(t("switchEditionHint"), { name: presetName(p) }), t("loadAndClear"),
        function () { loadPresetCards(p); closeModal(); },
        function () { closeModal(); editionsModal(); });   // back to the list
    }

    function draw() {
      list.textContent = "";
      allPresets().forEach(function (p) {
        var flat = presetFlatCards(p) || {};
        var isActive = p.id === state.activePresetId;
        var item = el("div", "preset-item" + (isActive ? " active" : ""));
        var main = el("div", "pi-main"); main.style.cursor = "pointer";
        main.appendChild(el("div", "pi-name", presetName(p)));
        main.appendChild(el("div", "pi-sub", (p.builtin ? t("builtin") : t("custom")) + " · " +
          fmt(t("cardsCount"), { s: (flat.suspects || []).length, w: (flat.weapons || []).length, r: (flat.rooms || []).length })));
        main.addEventListener("click", function () { confirmSwitch(p); });
        item.appendChild(main);
        if (isActive) item.appendChild(el("span", "pi-badge", t("active")));
        if (!p.builtin) {
          var ren = btn("✎", "pi-btn", function (e) {
            e.stopPropagation();
            var nn = prompt(t("editionNamePrompt"), presetName(p));
            if (nn && nn.trim()) { p.name = nn.trim(); save(); draw(); render(); }
          });
          ren.title = t("rename");
          var del = btn("✕", "pi-btn del", function (e) {
            e.stopPropagation();
            if (!confirm(t("deleteEditionConfirm"))) return;
            state.presets = state.presets.filter(function (x) { return x.id !== p.id; });
            save(); draw();
          });
          del.title = t("remove");
          item.appendChild(ren); item.appendChild(del);
        }
        list.appendChild(item);
      });
    }
    draw();
    m.appendChild(list);

    var saveBtn = btn("＋ " + t("saveAsEdition"), "ghost", function () {
      var nn = prompt(t("editionNamePrompt"), "");
      if (!nn || !nn.trim()) return;
      var flat = {};
      CATS.forEach(function (c) { flat[c] = state.cards[c].map(function (x) { return x.name; }); });
      var p = { id: uid("e"), builtin: false, name: nn.trim(), cards: flat };
      state.presets.push(p); state.activePresetId = p.id; save(); draw();
    });
    saveBtn.style.width = "100%"; saveBtn.style.marginTop = "4px";
    m.appendChild(saveBtn);
    actionBar(m);
  });
}

/* ---------- help / instructions modal ---------- */
function helpModal() {
  var h = (I18N[lang] && I18N[lang].help) || I18N.en.help;
  var li = function (s) { return "<li>" + s + "</li>"; };
  var key = function (cls, sym, s) { return li("<span class='key " + cls + "'>" + sym + "</span> " + s); };
  openModal(function (m) {
    m.innerHTML = "<h2>" + t("helpTitle") + "</h2><div class='help-body'>"
      + "<p>" + h.intro + "</p>"
      + "<h3>" + h.rulesH + "</h3><ul>" + [h.rObj, h.rSetup, h.rTurn, h.rShow, h.rAccuse].map(li).join("") + "</ul>"
      + "<p class='mini'>" + h.rNote + "</p>"
      + "<h3>" + h.gridH + "</h3><p>" + h.grid1 + "</p>"
      + "<ul>" + key("no", "✗", h.mNo) + key("yes", "✓", h.mYes) + key("maybe", "?", h.mMaybe) + "</ul>"
      + "<p>" + h.grid2 + "</p>"
      + "<h3>" + h.deduceH + "</h3><p>" + h.deduce1 + "</p>"
      + "<h3>" + h.handH + "</h3><p>" + h.hand1 + "</p>"
      + "<h3>" + h.editionsH + "</h3><p>" + h.editions1 + "</p>"
      + "<h3>" + h.notesH + "</h3><p>" + h.notes1 + "</p>"
      + "<h3>" + h.tipH + "</h3><ul>" + [h.tip1, h.tip2, h.tip3].map(li).join("") + "</ul>"
      + "</div>";
    actionBar(m);
  });
}

/* ---------- menu sheet (groups the not-often-used options) ---------- */
function menuModal() {
  openModal(function (m) {
    modalHead(m, t("menuTitle"));
    m.appendChild(labelRow(t("language"), segmented(
      [{ v: "en", label: "EN" }, { v: "it", label: "IT" }], lang,
      function (l) { setLang(l); closeModal(); menuModal(); }
    )));

    var list = el("div", "menu-list");
    [
      { ico: "👥", label: t("playersTitle"), fn: playersModal },
      { ico: "🃏", label: t("editionsTitle"), fn: editionsModal },
      { ico: "🙋", label: t("myHand"), fn: myHandModal },
      { ico: "⚙️", label: t("settingsTitle"), fn: settingsModal },
      { ico: "❓", label: t("helpTitle"), fn: helpModal },
      { ico: "🔄", label: t("newGame"), fn: newGameModal }
    ].forEach(function (it) {
      var b = btn(null, "menu-item", function () { closeModal(); it.fn(); });
      b.appendChild(el("span", "mi-ico", it.ico));
      b.appendChild(el("span", null, it.label));
      list.appendChild(b);
    });
    m.appendChild(list);
    actionBar(m);
  });
}

/* ---------- wire up ---------- */
byId("btn-menu").addEventListener("click", menuModal);
byId("btn-edition-chip").addEventListener("click", editionsModal);
byId("btn-privacy").addEventListener("click", function () { setPrivacy(true); });
byId("ps-reveal").addEventListener("click", function () { setPrivacy(false); });
byId("notes").addEventListener("input", function (e) { state.notes = e.target.value; save(); });
byId("grid").addEventListener("click", function (e) {          // one listener for all cells
  var td = e.target.closest ? e.target.closest("td.mark") : null;
  if (td) cycleCell(td.getAttribute("data-c"), td.getAttribute("data-p"));
});
window.addEventListener("resize", function () { updateHeaderOffset(); fitIfOverflow(); });

load();
render();
byId("app-version").textContent = "v" + APP_VERSION + " · " + APP_DATE;
</script>
</body>
</html>
