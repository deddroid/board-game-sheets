<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2433">
<title>Detective Notes</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #1d2433;
    --muted: #6b7280;
    --line: #d9dce3;
    --line-strong: #b9bec9;
    --accent: #3b5bdb;
    --me: #eef2ff;
    --me-line: #c7d2fe;
    --yes: #2f9e44;
    --yes-bg: #e6f5ea;
    --no: #c92a2a;
    --no-bg: #fbeaea;
    --maybe: #e8900c;
    --maybe-bg: #fdf3e2;
    --solved-bg: #fff8d6;
    --solved-line: #f1d472;
    --cat-suspects: #4c6ef5;
    --cat-weapons: #e8590c;
    --cat-rooms: #0ca678;
    --radius: 10px;
    --tap: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b;
      --panel: #1a1f29;
      --ink: #e6e8ee;
      --muted: #99a1b3;
      --line: #2b3240;
      --line-strong: #3a4354;
      --accent: #6b8afd;
      --me: #1b2440;
      --me-line: #35406a;
      --yes: #51cf66;
      --yes-bg: #16321f;
      --no: #ff6b6b;
      --no-bg: #371a1a;
      --maybe: #ffc078;
      --maybe-bg: #3a2c12;
      --solved-bg: #3a330f;
      --solved-line: #6d5e1b;
      --cat-suspects: #748ffc;
      --cat-weapons: #ff922b;
      --cat-rooms: #38d9a9;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 40;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
  .brand .logo {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), #5c7cfa); color: #fff;
    border-radius: 9px; font-size: 17px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar { display: flex; align-items: center; gap: 6px; flex: none; }
  header .spacer { flex: 1; }
  button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; min-height: var(--tap);
  }
  button.icon { min-width: 42px; min-height: 42px; padding: 8px; font-size: 17px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; min-height: 40px;
    border: 1px solid var(--line-strong); background: var(--panel); font-size: 14px;
  }
  .chip b { font-weight: 650; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ghost { background: transparent; border-color: var(--line); }
  .lang-toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .lang-toggle button { border: 0; border-radius: 0; padding: 8px 10px; min-height: 40px; background: transparent; color: var(--muted); }
  .lang-toggle button.on { background: var(--accent); color: #fff; }

  main { padding: 12px; max-width: 760px; margin: 0 auto; }

  /* Grid */
  .grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--line); text-align: center; }
  thead th {
    position: sticky; top: 0; background: var(--panel); z-index: 10;
    font-weight: 600; font-size: 13px; padding: 8px 4px; vertical-align: bottom;
  }
  th.card-head {
    position: sticky; left: 0; z-index: 20; background: var(--panel);
    text-align: left; min-width: 118px; max-width: 150px;
  }
  td.card-cell {
    position: sticky; left: 0; z-index: 5; background: var(--panel);
    text-align: left; padding: 8px 8px; font-size: 14px; min-width: 118px; max-width: 150px;
    line-height: 1.25;
  }
  tr.section-row th {
    position: sticky; left: 0; z-index: 6;
    background: var(--bg); color: var(--cat, var(--muted));
    text-transform: uppercase; letter-spacing: .6px; font-size: 11px;
    text-align: left; padding: 7px 8px 7px 10px; font-weight: 800;
    border-left: 4px solid var(--cat, var(--line));
  }
  td.card-cell { border-left: 4px solid var(--cat, var(--line)); }
  tr.cat-suspects { --cat: var(--cat-suspects); }
  tr.cat-weapons { --cat: var(--cat-weapons); }
  tr.cat-rooms { --cat: var(--cat-rooms); }
  th.player-head .pname { display: block; max-width: 72px; margin: 0 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th.player-head.me { background: var(--me); }
  td.mark { min-width: var(--tap); height: var(--tap); padding: 0; cursor: pointer; font-size: 20px; font-weight: 700; user-select: none; }
  td.col-me { background: var(--me); }
  td.mark.yes { color: var(--yes); background: var(--yes-bg); }
  td.mark.no { color: var(--no); background: var(--no-bg); }
  td.mark.maybe { color: var(--maybe); background: var(--maybe-bg); }
  tr.solved td.card-cell, tr.solved th.card-head { background: var(--solved-bg); font-weight: 700; }
  tr.solved { outline: 2px solid var(--solved-line); outline-offset: -2px; }
  .solvetag { display: inline-block; font-size: 10px; font-weight: 800; color: #8a6d00; margin-left: 4px; vertical-align: middle; }
  @media (prefers-color-scheme: dark) { .solvetag { color: var(--maybe); } }

  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 10px 2px 2px; color: var(--muted); font-size: 13px; }
  .legend b { font-size: 15px; }
  .legend .l-yes { color: var(--yes); } .legend .l-no { color: var(--no); } .legend .l-maybe { color: var(--maybe); }

  /* Notepad */
  section.block { margin-top: 18px; }
  section.block > h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 2px 8px; }
  textarea#notes {
    width: 100%; min-height: 160px; resize: vertical;
    border: 1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--panel); color: var(--ink); padding: 12px; font: inherit;
  }

  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  /* Modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 560px) { .modal-back { align-items: center; } }
  .modal {
    background: var(--panel); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 18px;
    padding-bottom: calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width: 560px) { .modal { border-radius: 16px; } }
  .modal h2 { margin: 0 0 12px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .modal input[type=text], .modal select {
    width: 100%; padding: 10px; border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--panel); color: var(--ink); font: inherit;
  }
  .player-edit { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .player-edit input[type=text] { flex: 1; }
  .player-edit .me-pick { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .player-edit button.del { color: var(--no); border-color: var(--line); }
  .cards-group { margin: 14px 0; }
  .cards-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 6px; }
  .card-edit { display: flex; gap: 8px; margin: 5px 0; }
  .card-edit input { flex: 1; }
  .check-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .check-list label { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); font-size: 14px; padding: 6px 2px; }
  .check-list input { width: 20px; height: 20px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .toggle-line { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .toggle-line input { width: 22px; height: 22px; }
  .danger { color: var(--no); border-color: var(--no); background: transparent; }
  .mini { font-size: 12px; color: var(--muted); }

  /* Editions list */
  .preset-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .preset-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel); cursor: pointer;
  }
  .preset-item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .preset-item .pi-main { flex: 1; min-width: 0; }
  .preset-item .pi-name { font-weight: 600; }
  .preset-item .pi-sub { font-size: 12px; color: var(--muted); }
  .preset-item .pi-badge { font-size: 11px; color: var(--accent); font-weight: 700; }
  .preset-item .pi-btn { padding: 6px 8px; min-height: 36px; font-size: 13px; border-color: var(--line); background: transparent; }
  .preset-item .pi-btn.del { color: var(--no); }

  /* Help / instructions */
  .help-body h3 { font-size: 14px; margin: 16px 0 6px; }
  .help-body p { margin: 6px 0; color: var(--ink); font-size: 14px; }
  .help-body ul { margin: 6px 0; padding-left: 20px; }
  .help-body li { margin: 4px 0; font-size: 14px; }
  .help-body .key {
    display: inline-block; min-width: 20px; text-align: center; font-weight: 700;
    border-radius: 5px; padding: 0 5px;
  }
  .help-body .key.yes { color: var(--yes); background: var(--yes-bg); }
  .help-body .key.no { color: var(--no); background: var(--no-bg); }
  .help-body .key.maybe { color: var(--maybe); background: var(--maybe-bg); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">🔍</span>
    <h1 id="app-title">Detective Notes</h1>
  </div>
  <div class="toolbar">
    <div class="lang-toggle" id="lang-toggle">
      <button data-lang="en">EN</button>
      <button data-lang="it">IT</button>
    </div>
    <button class="icon" id="btn-editions" title="Editions">🃏</button>
    <button class="icon" id="btn-players" title="Players">👥</button>
    <button class="icon" id="btn-help" title="How to use">❓</button>
    <button class="icon" id="btn-settings" title="Settings">⚙️</button>
  </div>
</header>

<main>
  <div class="row-actions" style="margin-top:0;margin-bottom:10px">
    <button id="btn-edition-chip" class="chip" title="Editions">🃏 <b id="edition-name">Classic</b></button>
    <button id="btn-myhand" class="ghost" data-i18n="myHand">My cards</button>
    <div class="spacer"></div>
    <button id="btn-new" class="ghost" data-i18n="newGame">New game</button>
  </div>

  <div class="grid-wrap">
    <table id="grid"></table>
  </div>

  <div class="legend">
    <span><b class="l-yes">✓</b> <span data-i18n="legYes">has the card</span></span>
    <span><b class="l-no">✗</b> <span data-i18n="legNo">doesn't have it</span></span>
    <span><b class="l-maybe">?</b> <span data-i18n="legMaybe">maybe</span></span>
    <span data-i18n="legTap">Tap a cell to cycle</span>
  </div>

  <section class="block">
    <h2 data-i18n="notesTitle">Notepad</h2>
    <textarea id="notes" data-i18n-ph="notesPh" placeholder="Who asked what, who showed a card, hunches…"></textarea>
  </section>

  <p class="mini" style="margin-top:22px;text-align:center" data-i18n="footer">
    Offline — everything is saved on this device only. Open-source Cluedo detective notes.
  </p>
</main>

<div id="modal-root"></div>

      tip3: "Quando resta un solo sospetto, una sola arma o una sola stanza non esclusi, quella è la tua accusa."

var DEFAULT_CARDS = {
  en: {
    suspects: ["Miss Scarlett", "Colonel Mustard", "Mrs White", "Reverend Green", "Mrs Peacock", "Professor Plum"],
    weapons: ["Candlestick", "Dagger", "Lead pipe", "Revolver", "Rope", "Wrench"],
    rooms: ["Kitchen", "Ballroom", "Conservatory", "Dining room", "Billiard room", "Library", "Lounge", "Hall", "Study"]
  },
  it: {
    suspects: ["Miss Scarlett", "Colonnello Mustard", "Signora White", "Reverendo Green", "Signora Peacock", "Professor Plum"],
    weapons: ["Candeliere", "Pugnale", "Tubo di piombo", "Rivoltella", "Corda", "Chiave inglese"],
    rooms: ["Cucina", "Sala da ballo", "Serra", "Sala da pranzo", "Sala del biliardo", "Biblioteca", "Salotto", "Ingresso", "Studio"]
  }
};

var CATS = ["suspects", "weapons", "rooms"];

/* Built-in editions. "cards" is per-language; user editions store a flat card set. */
var BUILTIN_PRESETS = [
  { id: "classic", builtin: true, name: { en: "Classic", it: "Classico" }, cards: DEFAULT_CARDS }
];

/* ---------- state ---------- */
var state = null;
var lang = lsGet(LANG_KEY) || (navigator.language && navigator.language.indexOf("it") === 0 ? "it" : "en");
if (lang !== "en" && lang !== "it") lang = "en";

function uid(p) { return p + Math.random().toString(36).slice(2, 9); }
function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k; }
function fmt(s, o) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return o[k] != null ? o[k] : ""; }); }

/* ---------- editions (presets) ---------- */
function presetName(p) { return typeof p.name === "string" ? p.name : (p.name[lang] || p.name.en); }
function presetFlatCards(p) {
  var c = p.cards;
  if (c && c[lang] && c[lang].suspects) return c[lang];   // per-language built-in, current lang
  if (c && c.en && c.en.suspects) return c.en;            // built-in fallback
  return c;                                               // flat user edition
}
function allPresets() { return BUILTIN_PRESETS.concat(state.presets || []); }
function activePreset() {
  return allPresets().filter(function (p) { return p.id === state.activePresetId; })[0] || null;
}
function loadPresetCards(p) {
  var flat = presetFlatCards(p);
  var cats = {};
  CATS.forEach(function (c) {
    cats[c] = (flat[c] || []).map(function (name) { return { id: uid("c"), name: name }; });
  });
  state.cards = cats;
  state.marks = {};
  state.auto = {};
  state.activePresetId = p.id;
  save();
}

function defaultState() {
  var cats = {};
  CATS.forEach(function (c) {
    cats[c] = DEFAULT_CARDS[lang][c].map(function (name) { return { id: uid("c"), name: name }; });
  });
  return {
    version: 2,
    autoDeduce: true,
    activePresetId: "classic",
    presets: [],
    players: [
      { id: uid("p"), name: t("me") === "io" ? "Io" : "Me", isMe: true },
      { id: uid("p"), name: t("player") + " 2", isMe: false },
      { id: uid("p"), name: t("player") + " 3", isMe: false }
    ],
    cards: cats,
    marks: {},       // marks[cardId][playerId] = 'yes'|'no'|'maybe'
    auto: {},        // auto[cardId][playerId] = true  -> this 'no' was auto-derived from a 'yes'
    notes: ""
  };
}

function load() {
  var raw = lsGet(STORE_KEY);
  if (raw) {
    try {
      var s = JSON.parse(raw);
      if (s && s.players && s.cards) {
        if (!Array.isArray(s.presets)) s.presets = [];
        if (!s.activePresetId) s.activePresetId = "classic";
        if (!s.auto) s.auto = {};
        state = s; return;
      }
    } catch (e) { /* corrupt — start fresh */ }
  }
  state = defaultState();
  save();
}
function save() {
  lsSet(STORE_KEY, JSON.stringify(state));
}

/* ---------- mark helpers ---------- */
function getMark(cardId, playerId) {
  return (state.marks[cardId] && state.marks[cardId][playerId]) || null;
}
function setMark(cardId, playerId, val) {
  if (!state.marks[cardId]) state.marks[cardId] = {};
  if (val === null) delete state.marks[cardId][playerId];
  else state.marks[cardId][playerId] = val;
}
var CYCLE = { "null": "no", "no": "yes", "yes": "maybe", "maybe": null };

/* auto-derived 'no' tracking (so leaving a ✓ removes the ✗ it placed) */
function isAuto(cardId, playerId) { return !!(state.auto[cardId] && state.auto[cardId][playerId]); }
function setAuto(cardId, playerId, v) {
  if (v) { if (!state.auto[cardId]) state.auto[cardId] = {}; state.auto[cardId][playerId] = true; }
  else if (state.auto[cardId]) { delete state.auto[cardId][playerId]; }
}

// one owner known -> everyone else doesn't have it (only fill blanks, flag as auto)
function cascadeYes(cardId, ownerId) {
  state.players.forEach(function (p) {
    if (p.id !== ownerId && getMark(cardId, p.id) === null) {
      setMark(cardId, p.id, "no");
      setAuto(cardId, p.id, true);
    }
  });
}
// leaving a ✓ -> remove only the ✗ that this app placed automatically
function uncascade(cardId, ownerId) {
  state.players.forEach(function (p) {
    if (p.id !== ownerId && isAuto(cardId, p.id) && getMark(cardId, p.id) === "no") {
      setMark(cardId, p.id, null);
      setAuto(cardId, p.id, false);
    }
  });
}

function cycleCell(cardId, playerId) {
  var cur = getMark(cardId, playerId);
  var next = CYCLE[cur === null ? "null" : cur];
  setAuto(cardId, playerId, false);          // a direct tap is a manual decision
  setMark(cardId, playerId, next);
  if (state.autoDeduce && cur === "yes" && next !== "yes") uncascade(cardId, playerId);
  if (state.autoDeduce && next === "yes") cascadeYes(cardId, playerId);
  save();
  render();
}

// a card is "solved" (in the envelope) if ruled out (no) for every player
function isSolved(cardId) {
  if (state.players.length === 0) return false;
  return state.players.every(function (p) { return getMark(cardId, p.id) === "no"; });
}

/* ---------- render grid ---------- */
function render() {
  document.getElementById("app-title").textContent = t("title");
  document.documentElement.lang = lang;
  // static i18n labels
  document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-i18n-ph")); });
  document.querySelectorAll("#lang-toggle button").forEach(function (b) {
    b.classList.toggle("on", b.getAttribute("data-lang") === lang);
  });
  document.getElementById("notes").value = state.notes || "";
  var ap = activePreset();
  document.getElementById("edition-name").textContent = ap ? presetName(ap) : t("custom");

  var tbl = document.getElementById("grid");
  tbl.innerHTML = "";

  // header
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  var corner = document.createElement("th");
  corner.className = "card-head";
  corner.textContent = "";
  hr.appendChild(corner);
  state.players.forEach(function (p) {
    var th = document.createElement("th");
    th.className = "player-head" + (p.isMe ? " me" : "");
    var span = document.createElement("span");
    span.className = "pname";
    span.textContent = p.name + (p.isMe ? " ★" : "");
    th.appendChild(span);
    hr.appendChild(th);
  });
  thead.appendChild(hr);
  tbl.appendChild(thead);

  var tbody = document.createElement("tbody");
  CATS.forEach(function (cat) {
    var sr = document.createElement("tr");
    sr.className = "section-row cat-" + cat;
    var sth = document.createElement("th");
    sth.colSpan = state.players.length + 1;
    sth.textContent = t(cat);
    sr.appendChild(sth);
    tbody.appendChild(sr);

    (state.cards[cat] || []).forEach(function (card) {
      var tr = document.createElement("tr");
      var solved = isSolved(card.id);
      tr.className = "cat-" + cat + (solved ? " solved" : "");
      var cc = document.createElement("td");
      cc.className = "card-cell";
      cc.textContent = card.name;
      if (solved) {
        var tag = document.createElement("span");
        tag.className = "solvetag";
        tag.textContent = " ◆ " + t("solution");
        cc.appendChild(tag);
      }
      tr.appendChild(cc);

      state.players.forEach(function (p) {
        var td = document.createElement("td");
        var mk = getMark(card.id, p.id);
        td.className = "mark" + (mk ? " " + mk : "") + (p.isMe ? " col-me" : "");
        td.textContent = mk === "yes" ? "✓" : mk === "no" ? "✗" : mk === "maybe" ? "?" : "";
        td.addEventListener("click", function () { cycleCell(card.id, p.id); });
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
  tbl.appendChild(tbody);
}

/* ---------- modal plumbing ---------- */
function openModal(buildBody) {
  var root = document.getElementById("modal-root");
  var back = document.createElement("div");
  back.className = "modal-back";
  var modal = document.createElement("div");
  modal.className = "modal";
  back.appendChild(modal);
  back.addEventListener("click", function (e) { if (e.target === back) closeModal(); });
  root.appendChild(back);
  buildBody(modal);
}
function closeModal() {
  var root = document.getElementById("modal-root");
  root.innerHTML = "";
  render();
}

/* ---------- players modal ---------- */
function playersModal() {
  openModal(function (m) {
    m.innerHTML = "<h2>" + t("playersTitle") + "</h2><p class='mini'>" + t("playersHint") + "</p>";
    var list = document.createElement("div");
    m.appendChild(list);

    function drawList() {
      list.innerHTML = "";
      state.players.forEach(function (p, idx) {
        var row = document.createElement("div");
        row.className = "player-edit";
        var inp = document.createElement("input");
        inp.type = "text"; inp.value = p.name;
        inp.addEventListener("input", function () { p.name = inp.value; save(); });
        var meLbl = document.createElement("label");
        meLbl.className = "me-pick";
        var meRadio = document.createElement("input");
        meRadio.type = "radio"; meRadio.name = "me-pick"; meRadio.checked = !!p.isMe;
        meRadio.addEventListener("change", function () {
          state.players.forEach(function (q) { q.isMe = false; });
          p.isMe = true; save();
        });
        meLbl.appendChild(meRadio);
        meLbl.appendChild(document.createTextNode(t("me")));
        var del = document.createElement("button");
        del.className = "del"; del.textContent = "✕";
        del.title = "remove";
        del.addEventListener("click", function () {
          if (state.players.length <= 2) return;
          // clean marks for this player
          Object.keys(state.marks).forEach(function (cid) { delete state.marks[cid][p.id]; });
          Object.keys(state.auto).forEach(function (cid) { delete state.auto[cid][p.id]; });
          state.players.splice(idx, 1);
          if (!state.players.some(function (q) { return q.isMe; })) state.players[0].isMe = true;
          save(); drawList();
        });
        row.appendChild(inp); row.appendChild(meLbl); row.appendChild(del);
        list.appendChild(row);
      });
    }
    drawList();

    var add = document.createElement("button");
    add.className = "ghost"; add.style.marginTop = "10px"; add.textContent = "+ " + t("addPlayer");
    add.addEventListener("click", function () {
      state.players.push({ id: uid("p"), name: t("player") + " " + (state.players.length + 1), isMe: false });
      save(); drawList();
    });
    m.appendChild(add);

    var actions = document.createElement("div");
    actions.className = "modal-actions";
    var done = document.createElement("button");
    done.className = "primary"; done.textContent = t("done");
    done.addEventListener("click", closeModal);
    actions.appendChild(done);
    m.appendChild(actions);
  });
}

/* ---------- settings modal (cards + auto-deduction) ---------- */
function settingsModal() {
  openModal(function (m) {
    m.innerHTML = "<h2>" + t("settingsTitle") + "</h2>";

    // auto deduce toggle
    var tog = document.createElement("div");
    tog.className = "toggle-line";
    var cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !!state.autoDeduce; cb.id = "ad";
    cb.addEventListener("change", function () { state.autoDeduce = cb.checked; save(); });
    var lab = document.createElement("label");
    lab.setAttribute("for", "ad"); lab.style.margin = "0"; lab.style.color = "var(--ink)";
    lab.textContent = t("autoDeduce");
    tog.appendChild(cb); tog.appendChild(lab);
    m.appendChild(tog);
    var adh = document.createElement("p"); adh.className = "mini"; adh.textContent = t("autoDeduceHint");
    m.appendChild(adh);

    // cards editor
    var ct = document.createElement("h2"); ct.style.fontSize = "16px"; ct.style.marginTop = "18px";
    ct.textContent = t("cardsTitle"); m.appendChild(ct);
    var ch = document.createElement("p"); ch.className = "mini"; ch.textContent = t("cardsHint"); m.appendChild(ch);

    CATS.forEach(function (cat) {
      var g = document.createElement("div"); g.className = "cards-group";
      var h = document.createElement("h3"); h.textContent = t(cat); g.appendChild(h);
      var wrap = document.createElement("div");
      function drawCards() {
        wrap.innerHTML = "";
        state.cards[cat].forEach(function (card, i) {
          var row = document.createElement("div"); row.className = "card-edit";
          var inp = document.createElement("input"); inp.type = "text"; inp.value = card.name;
          inp.addEventListener("input", function () { card.name = inp.value; save(); });
          var del = document.createElement("button"); del.className = "del danger"; del.textContent = "✕";
          del.addEventListener("click", function () {
            delete state.marks[card.id];
            state.cards[cat].splice(i, 1); save(); drawCards();
          });
          row.appendChild(inp); row.appendChild(del); wrap.appendChild(row);
        });
      }
      drawCards();
      g.appendChild(wrap);
      var add = document.createElement("button"); add.className = "ghost"; add.textContent = "+ " + t("addCard");
      add.addEventListener("click", function () {
        state.cards[cat].push({ id: uid("c"), name: "" }); save(); drawCards();
      });
      g.appendChild(add);
      m.appendChild(g);
    });

    var reset = document.createElement("button");
    reset.className = "ghost"; reset.style.marginTop = "6px"; reset.textContent = t("resetCards");
    reset.addEventListener("click", function () {
      var cats = {};
      CATS.forEach(function (c) {
        cats[c] = DEFAULT_CARDS[lang][c].map(function (name) { return { id: uid("c"), name: name }; });
      });
      state.cards = cats; state.marks = {}; state.auto = {}; save(); closeModal(); settingsModal();
    });
    m.appendChild(reset);

    var actions = document.createElement("div"); actions.className = "modal-actions";
    var done = document.createElement("button"); done.className = "primary"; done.textContent = t("done");
    done.addEventListener("click", closeModal);
    actions.appendChild(done); m.appendChild(actions);
  });
}

/* ---------- my hand modal ---------- */
function myHandModal() {
  var me = state.players.filter(function (p) { return p.isMe; })[0];
  openModal(function (m) {
    m.innerHTML = "<h2>" + t("myHandTitle") + "</h2>";
    if (!me) {
      var p = document.createElement("p"); p.textContent = t("noMe"); m.appendChild(p);
      var a = document.createElement("div"); a.className = "modal-actions";
      var b = document.createElement("button"); b.className = "primary"; b.textContent = t("done");
      b.addEventListener("click", closeModal); a.appendChild(b); m.appendChild(a);
      return;
    }
    var hint = document.createElement("p"); hint.className = "mini"; hint.textContent = t("myHandHint");
    m.appendChild(hint);
    CATS.forEach(function (cat) {
      var h = document.createElement("h3"); h.style.margin = "14px 0 6px"; h.style.fontSize = "13px";
      h.style.textTransform = "uppercase"; h.style.color = "var(--muted)"; h.textContent = t(cat);
      m.appendChild(h);
      var cl = document.createElement("div"); cl.className = "check-list";
      state.cards[cat].forEach(function (card) {
        var lab = document.createElement("label");

        cl.appendChild(lab);
      });

/* ---------- editions modal ---------- */
function editionsModal() {
  openModal(function (m) {
    m.innerHTML = "<h2>" + t("editionsTitle") + "</h2><p class='mini'>" + t("editionsHint") + "</p>";
    var list = document.createElement("div"); list.className = "preset-list";

    function confirmSwitch(p) {
      if (p.id === state.activePresetId) { closeModal(); return; }
      openModal(function (mm) {
        mm.innerHTML = "<h2>" + t("switchEditionTitle") + "</h2><p class='mini'>" +
          fmt(t("switchEditionHint"), { name: presetName(p) }) + "</p>";
        var a = document.createElement("div"); a.className = "modal-actions";
        var c = document.createElement("button"); c.className = "ghost"; c.textContent = t("cancel");
        c.addEventListener("click", closeModal);
        var ok = document.createElement("button"); ok.className = "primary"; ok.textContent = t("loadAndClear");
        ok.addEventListener("click", function () { loadPresetCards(p); closeModal(); });
        a.appendChild(c); a.appendChild(ok); mm.appendChild(a);
      });
    }

    function draw() {
      list.innerHTML = "";
      allPresets().forEach(function (p) {
        var flat = presetFlatCards(p) || {};
        var item = document.createElement("div");
        item.className = "preset-item" + (p.id === state.activePresetId ? " active" : "");
        var main = document.createElement("div"); main.className = "pi-main"; main.style.cursor = "pointer";
        var nm = document.createElement("div"); nm.className = "pi-name"; nm.textContent = presetName(p);
        var sub = document.createElement("div"); sub.className = "pi-sub";
        sub.textContent = (p.builtin ? t("builtin") : t("custom")) + " · " +
          fmt(t("cardsCount"), { s: (flat.suspects || []).length, w: (flat.weapons || []).length, r: (flat.rooms || []).length });
        main.appendChild(nm); main.appendChild(sub);
        main.addEventListener("click", function () { confirmSwitch(p); });
        item.appendChild(main);
        if (p.id === state.activePresetId) {
          var badge = document.createElement("span"); badge.className = "pi-badge"; badge.textContent = t("active");
          item.appendChild(badge);
        }
        if (!p.builtin) {
          var ren = document.createElement("button"); ren.className = "pi-btn"; ren.textContent = "✎"; ren.title = t("rename");
          ren.addEventListener("click", function (e) {
            e.stopPropagation();
            var nn = prompt(t("editionNamePrompt"), presetName(p));
            if (nn && nn.trim()) { p.name = nn.trim(); save(); draw(); render(); }
          });
          var del = document.createElement("button"); del.className = "pi-btn del"; del.textContent = "✕"; del.title = t("remove");
          del.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!confirm(t("deleteEditionConfirm"))) return;
            state.presets = state.presets.filter(function (x) { return x.id !== p.id; });
            save(); draw();
          });
          item.appendChild(ren); item.appendChild(del);
        }
        list.appendChild(item);
      });
    }
    draw();
    m.appendChild(list);

    var saveBtn = document.createElement("button");
    saveBtn.className = "ghost"; saveBtn.style.width = "100%"; saveBtn.style.marginTop = "4px";
    saveBtn.textContent = "＋ " + t("saveAsEdition");
    saveBtn.addEventListener("click", function () {
      var nn = prompt(t("editionNamePrompt"), "");
      if (!nn || !nn.trim()) return;
      var flat = {};
      CATS.forEach(function (c) { flat[c] = state.cards[c].map(function (x) { return x.name; }); });
      var p = { id: uid("e"), builtin: false, name: nn.trim(), cards: flat };
      state.presets.push(p); state.activePresetId = p.id; save(); draw();
    });
    m.appendChild(saveBtn);

    var actions = document.createElement("div"); actions.className = "modal-actions";
    var done = document.createElement("button"); done.className = "primary"; done.textContent = t("done");
    done.addEventListener("click", closeModal);
    actions.appendChild(done); m.appendChild(actions);
  });
}

    html += "<p>" + h.grid2 + "</p>";
    html += "<h3>" + h.deduceH + "</h3><p>" + h.deduce1 + "</p>";
    html += "<h3>" + h.handH + "</h3><p>" + h.hand1 + "</p>";
    html += "<h3>" + h.editionsH + "</h3><p>" + h.editions1 + "</p>";
    html += "<h3>" + h.notesH + "</h3><p>" + h.notes1 + "</p>";
    html += "<h3>" + h.tipH + "</h3><ul><li>" + h.tip1 + "</li><li>" + h.tip2 + "</li><li>" + h.tip3 + "</li></ul>";
    html += "</div>";
    m.innerHTML = html;
    var actions = document.createElement("div"); actions.className = "modal-actions";
    var done = document.createElement("button"); done.className = "primary"; done.textContent = t("done");
    done.addEventListener("click", closeModal);
    actions.appendChild(done); m.appendChild(actions);
  });
}
