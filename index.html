<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Sheets</title>
<meta name="description" content="A suite of single-file, offline companion sheets for board games.">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --fg:#1b1d22; --muted:#5d6672;
    --border:#e2e5ea; --accent:#3b6fd4; --accent-fg:#ffffff;
    --shadow:0 1px 3px rgba(20,25,40,.08),0 8px 24px rgba(20,25,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14161b; --card:#1d2027; --fg:#eceef2; --muted:#9aa3b2;
      --border:#2a2e37; --accent:#6f9bff; --accent-fg:#0d1016;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%;
    padding:16px; padding-bottom:40px;
  }
  .wrap{max-width:720px; margin:0 auto}
  header{display:flex; align-items:flex-start; gap:12px; margin:8px 0 20px}
  .title{flex:1}
  h1{font-size:1.6rem; margin:0 0 4px; letter-spacing:-.01em}
  .sub{color:var(--muted); margin:0; font-size:.95rem}
  .lang{
    display:inline-flex; border:1px solid var(--border); border-radius:999px;
    overflow:hidden; background:var(--card); flex:none;
  }
  .lang button{
    appearance:none; border:0; background:transparent; color:var(--muted);
    font:inherit; font-size:.85rem; font-weight:600; padding:7px 12px; cursor:pointer;
  }
  .lang button[aria-pressed="true"]{background:var(--accent); color:var(--accent-fg)}
  .games{list-style:none; margin:0; padding:0; display:grid; gap:12px}
  .game{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease;
  }
  .game:hover{transform:translateY(-2px); border-color:var(--accent)}
  .game:active{transform:translateY(0)}
  .emoji{font-size:1.9rem; line-height:1; flex:none; width:44px; text-align:center}
  .game .name{font-weight:650; font-size:1.08rem; margin:0}
  .game .desc{color:var(--muted); font-size:.9rem; margin:3px 0 0}
  .arrow{margin-left:auto; color:var(--muted); flex:none; font-size:1.2rem}
  footer{margin-top:28px; text-align:center; color:var(--muted); font-size:.8rem}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1 data-i18n="title">Board Game Sheets</h1>
      <p class="sub" data-i18n="sub">Offline companion sheets for board games — one file each, open on any phone.</p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="it">IT</button>
    </div>
  </header>

  <ul class="games" id="games"></ul>

  <footer>
    <span data-i18n="footer">Each sheet is a single HTML file — works offline, nothing to install.</span>
  </footer>
</div>

<script>
// --- Game registry: add a game = add an entry here + its folder under games/ ---
const GAMES = [
  {
    emoji: "🔍",
    path: "games/cluedo-detective-notes/index.html",
    name: { en: "Detective Notes", it: "Note dell'investigatore" },
    desc: {
      en: "Deduction sheet for the classic whodunit: suspects, weapons, rooms.",
      it: "Foglio di deduzione per il giallo classico: sospetti, armi, stanze."
    }
  }
];

const UI = {
  en: {
    title: "Board Game Sheets",
    sub: "Offline companion sheets for board games — one file each, open on any phone.",
    footer: "Each sheet is a single HTML file — works offline, nothing to install."
  },
  it: {
    title: "Fogli per giochi da tavolo",
    sub: "Fogli di supporto offline per i giochi da tavolo — un file ciascuno, aprili da qualsiasi telefono.",
    footer: "Ogni foglio è un singolo file HTML — funziona offline, niente da installare."
  }
};

function getLang(){
  try { const s = localStorage.getItem("bgs-lang"); if (s==="en"||s==="it") return s; } catch(e){}
  return (navigator.language||"en").toLowerCase().startsWith("it") ? "it" : "en";
}
function setLang(lang){
  try { localStorage.setItem("bgs-lang", lang); } catch(e){}
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (UI[lang][k]) el.textContent = UI[lang][k];
  });
  document.querySelectorAll(".lang button").forEach(b=>{
    b.setAttribute("aria-pressed", String(b.dataset.lang===lang));
  });
  renderGames(lang);
}
function renderGames(lang){
  const ul = document.getElementById("games");
  ul.innerHTML = "";
  GAMES.forEach(g=>{
    const a = document.createElement("a");
    a.className = "game";
    a.href = g.path;
    a.innerHTML =
      '<span class="emoji" aria-hidden="true">'+g.emoji+'</span>'+
      '<span><span class="name">'+g.name[lang]+'</span>'+
      '<span class="desc">'+g.desc[lang]+'</span></span>'+
      '<span class="arrow" aria-hidden="true">→</span>';
    ul.appendChild(a);
  });
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click", ()=>setLang(b.dataset.lang));
});
setLang(getLang());
</script>
</body>
</html>
